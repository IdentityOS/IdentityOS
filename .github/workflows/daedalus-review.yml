name: Daedalus PR Review

# The privileged job always executes code from the trusted base revision. The
# pull request is consumed only as inert diff text, so fork authors cannot run
# code with repository secrets or a write-capable token.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

env:
  REVIEW_IDENTITY: "daedalus"

jobs:
  await-checks:
    if: >-
      github.event.pull_request.draft == false &&
      ((github.event_name == 'pull_request_target' &&
      github.event.pull_request.head.repo.full_name != github.repository) ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    permissions:
      checks: read
      contents: read
    steps:
      - name: Wait for independent checks to finish
        uses: actions/github-script@v7
        with:
          script: |
            const terminal = new Set(['completed']);
            const ignoredNames = new Set(['await-checks', 'review']);
            const sha = context.payload.pull_request.head.sha;
            // Let sibling workflows register their check runs before the first query.
            await new Promise(resolve => setTimeout(resolve, 10000));
            for (let attempt = 1; attempt <= 120; attempt += 1) {
              const response = await github.rest.checks.listForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: sha,
                per_page: 100
              });
              const latestByName = new Map();
              for (const run of response.data.check_runs) {
                const prior = latestByName.get(run.name);
                const runTime = Date.parse(run.started_at || run.created_at || 0);
                const priorTime = Date.parse(prior?.started_at || prior?.created_at || 0);
                if (!prior || runTime > priorTime) latestByName.set(run.name, run);
              }
              const independent = [...latestByName.values()].filter(
                run => !ignoredNames.has(run.name)
              );
              const pending = independent.filter(run => !terminal.has(run.status));
              if (independent.length > 0 && pending.length === 0) {
                core.info(`Observed ${independent.length} completed independent checks.`);
                return;
              }
              core.info(
                `Waiting for independent checks (${pending.map(run => `${run.name}:${run.status}`).join(', ') || 'registration'}).`
              );
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
            core.setFailed('Independent checks did not finish within 20 minutes; Daedalus will not claim readiness.');

  review:
    needs: await-checks
    if: >-
      github.event.pull_request.draft == false &&
      ((github.event_name == 'pull_request_target' &&
      github.event.pull_request.head.repo.full_name != github.repository) ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    concurrency:
      group: identityos-provider
      cancel-in-progress: false
      queue: max
    permissions:
      checks: read
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Check out trusted review implementation
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install trusted review dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Materialize pull request diff as inert data
        env:
          DIFF_PATH: /tmp/pr.diff
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.clone_url }}
        shell: bash
        run: |
          set -euo pipefail
          # Fetch commit objects only. The untrusted tree is never checked out
          # or executed; --no-ext-diff/--no-textconv keep diff generation inert.
          git -c protocol.file.allow=never fetch \
            --no-tags --depth=1 "$HEAD_REPOSITORY" "$HEAD_SHA"
          umask 077
          git diff --no-ext-diff --no-textconv --binary \
            "$BASE_SHA" "$HEAD_SHA" > "$DIFF_PATH"
          bytes=$(wc -c < "$DIFF_PATH")
          if (( bytes > 5 * 1024 * 1024 )); then
            echo "Pull request diff is too large to review safely ($bytes bytes)" >&2
            exit 1
          fi
          echo "Materialized $(wc -l < "$DIFF_PATH") diff lines"

      - name: Record independent check evidence
        uses: actions/github-script@v7
        env:
          RESULTS_PATH: /tmp/test-results.txt
        with:
          script: |
            const fs = require('fs');
            const sha = context.payload.pull_request.head.sha;
            const checkRuns = [];
            for (let page = 1; ; page += 1) {
              const response = await github.rest.checks.listForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: sha,
                per_page: 100,
                page
              });
              checkRuns.push(...response.data.check_runs);
              if (response.data.check_runs.length < 100) break;
            }
            const latestByName = new Map();
            for (const run of checkRuns) {
              const prior = latestByName.get(run.name);
              const runTime = Date.parse(run.started_at || run.created_at || 0);
              const priorTime = Date.parse(prior?.started_at || prior?.created_at || 0);
              if (!prior || runTime > priorTime) latestByName.set(run.name, run);
            }
            const lines = [
              `Untrusted head SHA: ${sha}`,
              'Pull request code is tested only by separate read-only jobs.',
              ...[...latestByName.values()]
                .filter(run => !['await-checks', 'review'].includes(run.name))
                .map(run => `${run.name}: ${run.conclusion || run.status}`)
            ];
            fs.writeFileSync(process.env.RESULTS_PATH, lines.join('\n') + '\n', {mode: 0o600});

      - name: Run Daedalus review against trusted code
        id: daedalus
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
          GROQ_API_KEY_4: ${{ secrets.GROQ_API_KEY_4 }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          CEREBRAS_API_KEY_2: ${{ secrets.CEREBRAS_API_KEY_2 }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ZEN_API_KEY: ${{ secrets.ZEN_API_KEY }}
          REVIEW_REPOSITORY: ${{ github.repository }}
          REVIEW_PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEW_HEAD_REF: ${{ github.event.pull_request.head.label }}
          REVIEW_BASE_REF: ${{ github.event.pull_request.base.ref }}
          REVIEW_TITLE: ${{ github.event.pull_request.title }}
          REVIEW_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REVIEW_CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
          REVIEW_ADDITIONS: ${{ github.event.pull_request.additions }}
          REVIEW_DELETIONS: ${{ github.event.pull_request.deletions }}
        run: |
          python scripts/daedalus_review.py \
            --diff /tmp/pr.diff \
            --repo "$REVIEW_REPOSITORY" \
            --pr-number "$REVIEW_PR_NUMBER" \
            --head-ref "$REVIEW_HEAD_REF" \
            --base-ref "$REVIEW_BASE_REF" \
            --title "$REVIEW_TITLE" \
            --output /tmp/daedalus-review.md \
            --test-results /tmp/test-results.txt

      - name: Publish or update Daedalus review
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const marker = '<!-- daedalus-review -->';
            let review;
            try {
              review = fs.readFileSync('/tmp/daedalus-review.md', 'utf8');
            } catch (error) {
              review = '## Daedalus Review\n\nDaedalus could not produce a review artifact.';
            }
            const body = `${marker}\n${review}`;
            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100
              }
            );
            const prior = comments.find(comment =>
              comment.user?.login === 'github-actions[bot]' &&
              comment.body?.includes(marker)
            );
            if (prior) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: prior.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body
              });
            }

      - name: Apply Daedalus readiness labels
        uses: actions/github-script@v7
        env:
          REVIEW_STATUS: ${{ steps.daedalus.outputs.status }}
        with:
          github-token: ${{ github.token }}
          script: |
            const status = process.env.REVIEW_STATUS;
            const labels = ['daedalus-reviewed'];
            if (status === 'NEEDS_WORK') labels.push('needs-changes');
            if (status === 'NOT_READY') labels.push('blocked');
            if (status === 'READY') labels.push('ready-to-merge');
            if (status === 'INCONCLUSIVE') labels.push('review-inconclusive');

            if (status === 'INCONCLUSIVE') {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: 'review-inconclusive'
                });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: 'review-inconclusive',
                  color: 'd4c5f9',
                  description: 'Daedalus could not verify its review evidence'
                });
              }
            }

            for (const label of ['needs-changes', 'blocked', 'ready-to-merge', 'review-inconclusive']) {
              try {
                await github.rest.issues.removeLabel({
                  issue_number: context.issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label
                });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }
            await github.rest.issues.addLabels({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels
            });
